[project]
name = "replaypos"
version = "0.1.0"
description = "GIS-based replay, analysis and reporting platform for mobile objects"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PyQt6>=6.7",
    "PyQt6-WebEngine>=6.7",
    "pydantic>=2.0",
    "loguru>=0.7",
    "pyqtgraph>=0.13",
    "numpy>=1.26",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pyproj>=3.6",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-asyncio>=0.23",
]
reporting = [
    "weasyprint>=61",
    "matplotlib>=3.8",
]
export = [
    "ffmpeg-python>=0.2",
]

[project.urls]
Homepage = "https://github.com/anomalyco/replaypos"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
